name: Prose

# Vale over the lines a PR ADDS or changes, with the rules in .vale/styles/projectMM/. Diff-scoped
# on purpose: the tree still holds pre-existing violations, and a contributor is answerable for
# what they wrote, not for inherited prose. An `error` (em-dash, British spelling, "e.g.") fails
# the check; warnings and suggestions land as inline annotations only.
#
# Two things are scheduled to change once the tree is swept clean (`vale docs/` exits 0): this
# job drops `filter_mode` and checks whole files, and moondeck/check/{check_prose,hook_prose}.py
# are deleted, since their only job was the added-lines scope this job then no longer needs.

on:
  pull_request:
    paths:
      - '**.md'
      - '.vale.ini'
      - '.vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: reviewdog diffs against the base branch to scope `filter_mode: added`.
          # A shallow clone leaves it no base, so every line of every file reads as added and the
          # run dies on GitHub's 50-annotation cap instead of reporting the diff.
          fetch-depth: 0
      - uses: errata-ai/vale-action@v2
        with:
          # Annotate only the lines this PR touches. This scopes what reviewdog REPORTS, not what
          # Vale scans: Vale reads the whole tree either way.
          filter_mode: added
          # Deliberately absent: fail_on_error. Vale emits ~1,900 errors across 39 files of prose
          # that predates the standards, and fail_on_error judges that full output rather than the
          # filtered annotations, so it fails every PR whatever the PR changed.
          # check_prose.py is the gate that blocks: it feeds Vale the added lines alone.
          # Turn this on once the sweep in docs/work/present clears the tree.
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
